[project]
name = "asyncresil"
version = "0.0.1"
description = "Async resilience utilities — circuit breaker, rate limiter, cache, http client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kevin Reber", email = "kevinreber1@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["asyncio", "resilience", "circuit-breaker", "rate-limit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.28.1",
]

[project.optional-dependencies]
redis = ["redis>=5"]

[project.urls]
Homepage = "https://github.com/kevinreber/aura-utils"
Issues   = "https://github.com/kevinreber/aura-utils/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.35.1",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
]
